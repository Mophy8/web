<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>AI 真人文章朗讀｜經文誦念</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    background:
        radial-gradient(
            circle at top,
            #263b5a,
            #0d1625 70%
        );
    color:#fff;
    min-height:100vh;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px 15px 60px;
}

/* 標題 */

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    font-size:45px;
}

.header h1{
    margin:5px 0;
    font-size:30px;
}

.header p{
    color:#aebed3;
    margin:8px 0;
}

/* 模式 */

.mode{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
}

.mode button{
    border:none;
    padding:15px;
    border-radius:15px;
    background:#1d2b40;
    color:#cbd5e1;
    font-size:17px;
    cursor:pointer;
}

.mode button.active{
    background:#2563eb;
    color:#fff;
}

/* 卡片 */

.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

/* 輸入 */

input,
select,
textarea{
    width:100%;
    border:none;
    outline:none;
    border-radius:12px;
    padding:13px;
    font-size:16px;
}

input,
select{
    background:#f8fafc;
    color:#1e293b;
}

textarea{
    min-height:280px;
    resize:vertical;
    background:#f8fafc;
    color:#1e293b;
    line-height:1.8;
    font-size:18px;
}

.word{
    text-align:right;
    color:#94a3b8;
    margin-top:6px;
    font-size:13px;
}

/* 聲音 */

.voice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.voice-card{
    padding:14px;
    border-radius:15px;
    background:#162235;
    cursor:pointer;
    border:2px solid transparent;
}

.voice-card.selected{
    border-color:#38bdf8;
    background:#1d334c;
}

.voice-title{
    font-size:17px;
    font-weight:bold;
}

.voice-info{
    font-size:13px;
    color:#94a3b8;
    margin-top:4px;
}

/* 次數 */

.repeat-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin:15px 0;
}

.repeat-box button{
    width:45px;
    height:45px;
    border-radius:50%;
    border:none;
    background:#334155;
    color:white;
    font-size:24px;
    cursor:pointer;
}

#repeatCount{
    width:100px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

/* 快捷次數 */

.quick{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.quick button{
    border:none;
    border-radius:20px;
    padding:8px 15px;
    background:#334155;
    color:white;
    cursor:pointer;
}

.quick button:hover{
    background:#475569;
}

/* 控制 */

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    border-radius:30px;
    padding:13px 22px;
    font-size:16px;
    cursor:pointer;
}

.start{
    background:#22c55e;
    color:white;
}

.pause{
    background:#f59e0b;
    color:white;
}

.stop{
    background:#ef4444;
    color:white;
}

.resume{
    background:#3b82f6;
    color:white;
}

/* 聲波 */

.wave{
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    margin:5px 0 10px;
}

.wave span{
    width:6px;
    height:20px;
    background:#38bdf8;
    border-radius:10px;
    transition:height .08s;
}

/* 狀態 */

.status{
    text-align:center;
    font-size:18px;
    margin:10px 0;
}

.counter{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#38bdf8;
}

/* 進度 */

.progress{
    height:9px;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    width:0;
    height:100%;
    background:#38bdf8;
    transition:width .3s;
}

/* 統計 */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    text-align:center;
    background:#162235;
    padding:15px;
    border-radius:15px;
}

.stat-number{
    font-size:25px;
    font-weight:bold;
    color:#38bdf8;
}

.stat-label{
    color:#94a3b8;
    font-size:13px;
}

/* 繼續 */

.resume-box{
    display:none;
    background:#172a3f;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.resume-box.show{
    display:block;
}

.resume-title{
    font-weight:bold;
    margin-bottom:5px;
}

.resume-buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.resume-buttons button{
    border:none;
    padding:9px 15px;
    border-radius:20px;
    cursor:pointer;
}

.continue{
    background:#22c55e;
    color:white;
}

.restart{
    background:#475569;
    color:white;
}

/* 隱藏 */

.hidden{
    display:none;
}

/* 手機 */

@media(max-width:650px){

    .container{
        padding:18px 12px 40px;
    }

    .header h1{
        font-size:25px;
    }

    .voice-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr 1fr;
    }

    textarea{
        min-height:240px;
    }

    .wave{
        height:140px;
    }
}

</style>
</head>

<div

<script>

/* ==================================================
   GAS 網址
   部署 GAS 後，把網址貼在這裡
================================================== */

const GAS_URL =
    "https://script.google.com/macros/s/AKfycbx0KmFuf5OGLysk5tgCeeTMrapMpO47OfJWgDUsYu0-BZCptCdjj4XGp_dUh2EUKm0s/exec";


/* ==================================================
   聲音設定
================================================== */

const VOICES = [

    {
        id:"cmn-CN-Chirp3-HD-Gacrux",
        name:"🌸 溫柔女聲",
        gender:"女性",
        style:"自然、溫柔",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Kore",
        name:"🌷 知性女聲",
        gender:"女性",
        style:"清楚、知性",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Leda",
        name:"🌼 親切女聲",
        gender:"女性",
        style:"親切、柔和",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Laomedeia",
        name:"🧘 沉靜女聲",
        gender:"女性",
        style:"適合經文",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Sulafat",
        name:"❤️ 溫暖女聲",
        gender:"女性",
        style:"溫暖、自然",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Iapetus",
        name:"🎙 穩重男聲",
        gender:"男性",
        style:"穩重、清晰",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Schedar",
        name:"📖 沉穩男聲",
        gender:"男性",
        style:"適合文章",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Orus",
        name:"🎧 磁性男聲",
        gender:"男性",
        style:"自然、有厚度",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Rasalgethi",
        name:"🧘 禪意男聲",
        gender:"男性",
        style:"沉穩、適合經文",
        language:"cmn-CN"
    },

    {
        id:"cmn-CN-Chirp3-HD-Fenrir",
        name:"👨 自然男聲",
        gender:"男性",
        style:"自然、清楚",
        language:"cmn-CN"
    }

];


/* ==================================================
   全域狀態
================================================== */

let selectedVoice =
    VOICES[0];

let audio = null;

let audioUrl = null;

let audioContext = null;

let analyser = null;

let sourceNode = null;

let animationId = null;

let currentRepeat = 0;

let totalRepeat = 1;

let isStopped = true;

let mode = "article";

let currentCacheKey = "";

let pendingStart = false;


/* ==================================================
   初始化聲音
================================================== */

function renderVoices(){

    const grid =
        document.getElementById(
            "voiceGrid"
        );

    grid.innerHTML = "";

    VOICES.forEach(
        (voice,index)=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "voice-card"
                +
                (
                    index === 0
                    ? " selected"
                    : ""
                );

            div.innerHTML = `

                <div class="voice-title">
                    ${voice.name}
                </div>

                <div class="voice-info">
                    ${voice.gender}
                    ・
                    ${voice.style}
                </div>

            `;

            div.onclick =
                function(){

                    document
                    .querySelectorAll(
                        ".voice-card"
                    )
                    .forEach(
                        x =>
                        x.classList.remove(
                            "selected"
                        )
                    );

                    div.classList.add(
                        "selected"
                    );

                    selectedVoice =
                        voice;

                    invalidateCache();

                };

            grid.appendChild(div);

        }
    );

}


/* ==================================================
   模式
================================================== */

function setMode(newMode){

    mode = newMode;

    document
    .getElementById("articleMode")
    .classList.toggle(
        "active",
        mode === "article"
    );

    document
    .getElementById("sutraMode")
    .classList.toggle(
        "active",
        mode === "sutra"
    );


    const label =
        document.getElementById(
            "titleLabel"
        );

    if(mode === "sutra"){

        label.innerHTML =
            "<label>🙏 經文名稱</label>";

    }else{

        label.innerHTML =
            "<label>📝 文章標題</label>";

    }

}


/* ==================================================
   字數
================================================== */

document
.getElementById("text")
.addEventListener(
    "input",
    function(){

        document
        .getElementById(
            "wordCount"
        )
        .textContent =
        this.value.length;

        invalidateCache();

    }
);


/* ==================================================
   語速
================================================== */

document
.getElementById("rate")
.addEventListener(
    "input",
    function(){

        document
        .getElementById(
            "rateValue"
        )
        .textContent =
        Number(this.value)
        .toFixed(2);

        invalidateCache();

    }
);


/* ==================================================
   次數
================================================== */

function setRepeat(value){

    document
    .getElementById(
        "repeatCount"
    )
    .value =
    value;

}

function changeRepeat(value){

    const input =
        document.getElementById(
            "repeatCount"
        );

    let n =
        Number(input.value) || 1;

    n += value;

    if(n < 1)
        n = 1;

    if(n > 100000)
        n = 100000;

    input.value = n;

}


/* ==================================================
   建立 Cache Key
================================================== */

function createCacheKey(){

    const text =
        document
        .getElementById(
            "text"
        )
        .value
        .trim();

    const title =
        document
        .getElementById(
            "title"
        )
        .value
        .trim();

    const rate =
        document
        .getElementById(
            "rate"
        )
        .value;

    return [
        title,
        text,
        selectedVoice.id,
        rate
    ].join("|");

}


/* ==================================================
   Cache 無效化
================================================== */

function invalidateCache(){

    currentCacheKey = "";

}


/* ==================================================
   產生語音
================================================== */

async function generateAudio(){

    if(
        !GAS_URL ||
        GAS_URL.startsWith("請把")
    ){

        alert(
            "請先在 index.html 設定 GAS_URL"
        );

        return null;

    }


    const text =
        document
        .getElementById(
            "text"
        )
        .value
        .trim();


    if(!text){

        alert(
            "請先輸入文章或經文"
        );

        return null;

    }


    const title =
        document
        .getElementById(
            "title"
        )
        .value
        .trim();


    setStatus(
        "⏳ 正在產生 AI 真人語音……"
    );


    try{

        const response =
            await fetch(
                GAS_URL,
                {
                    method:"POST",

                    body:
                    JSON.stringify({

                        action:
                        "generateTTS",

                        title:title,

                        text:text,

                        voice:
                        selectedVoice.id,

                        language:
                        selectedVoice.language,

                        rate:
                        Number(
                            document
                            .getElementById(
                                "rate"
                            )
                            .value
                        )

                    })
                }
            );


        const result =
            await response.json();


        if(
            !result.success
        ){

            throw new Error(
                result.message
                ||
                "語音產生失敗"
            );

        }


        const base64 =
            result.audio;


        const binary =
            atob(base64);


        const bytes =
            new Uint8Array(
                binary.length
            );


        for(
            let i=0;
            i<binary.length;
            i++
        ){

            bytes[i] =
                binary.charCodeAt(i);

        }


        const blob =
            new Blob(
                [bytes],
                {
                    type:"audio/mpeg"
                }
            );


        audioUrl =
            URL.createObjectURL(
                blob
            );


        audio =
            new Audio(
                audioUrl
            );


        currentCacheKey =
            createCacheKey();


        /*
           把音訊放入 IndexedDB
           讓大量誦念時不需要重新生成。
        */

        await saveAudioCache(
            currentCacheKey,
            base64
        );


        setupAudioAnalyzer();


        return audio;

    }
    catch(error){

        console.error(error);

        setStatus(
            "❌ "
            + error.message
        );

        return null;

    }

}


/* ==================================================
   取得快取音訊
================================================== */

async function getCachedAudio(){

    const key =
        createCacheKey();

    const data =
        await readAudioCache(
            key
        );


    if(!data)
        return null;


    const binary =
        atob(data);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for(
        let i=0;
        i<binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }


    const blob =
        new Blob(
            [bytes],
            {
                type:"audio/mpeg"
            }
        );


    audioUrl =
        URL.createObjectURL(
            blob
        );


    audio =
        new Audio(
            audioUrl
        );


    currentCacheKey =
        key;


    setupAudioAnalyzer();


    return audio;

}


/* ==================================================
   開始
================================================== */

async function startReading(){

    stopReading();


    const text =
        document
        .getElementById(
            "text"
        )
        .value
        .trim();


    if(!text){

        alert(
            "請先輸入內容"
        );

        return;

    }


    totalRepeat =
        Number(
            document
            .getElementById(
                "repeatCount"
            )
            .value
        );


    if(
        !totalRepeat ||
        totalRepeat < 1
    )
        totalRepeat = 1;


    if(totalRepeat > 100000)
        totalRepeat = 100000;


    document
    .getElementById(
        "totalRepeat"
    )
    .textContent =
    totalRepeat;


    currentRepeat = 1;

    isStopped = false;


    await playCurrent();

}


/* ==================================================
   播放目前這一遍
================================================== */

async function playCurrent(){

    if(isStopped)
        return;


    let player =
        await getCachedAudio();


    if(!player){

        player =
            await generateAudio();

    }


    if(!player)
        return;


    /*
       每次播放前重新設定
    */

    player.currentTime = 0;

    player.playbackRate =
        Number(
            document
            .getElementById(
                "rate"
            )
            .value
        );


    player.onended =
        function(){

            if(isStopped)
                return;


            if(
                currentRepeat
                <
                totalRepeat
            ){

                currentRepeat++;

                updateRepeatUI();

                saveProgress();

                setTimeout(
                    playCurrent,
                    200
                );

            }else{

                finishReading();

            }

        };


    updateRepeatUI();

    setStatus(
        mode === "sutra"
        ?
        "🙏 正在誦念"
        :
        "🎙 正在朗讀"
    );


    try{

        await player.play();

        startWave();

    }
    catch(error){

        setStatus(
            "⚠️ 請點擊開始播放"
        );

    }

}


/* ==================================================
   暫停
================================================== */

function pauseReading(){

    if(
        audio &&
        !audio.paused
    ){

        audio.pause();

        stopWave();

        setStatus(
            "⏸ 已暫停"
        );

    }

}


/* ==================================================
   繼續
================================================== */

function resumeReading(){

    if(
        audio &&
        audio.paused
    ){

        audio.play();

        startWave();

        setStatus(
            mode === "sutra"
            ?
            "🙏 正在誦念"
            :
            "🎙 正在朗讀"
        );

    }

}


/* ==================================================
   停止
================================================== */

function stopReading(){

    isStopped = true;

    if(audio){

        audio.pause();

        audio.currentTime = 0;

    }

    stopWave();

}


/* ==================================================
   完成
================================================== */

function finishReading(){

    isStopped = true;

    stopWave();

    setStatus(
        "✅ 已完成 "
        + totalRepeat
        + " 遍"
    );


    localStorage.removeItem(
        "ttsReadingProgress"
    );


    addTodayCount(
        totalRepeat
    );


    document
    .getElementById(
        "progressBar"
    )
    .style.width =
    "100%";

}


/* ==================================================
   UI
================================================== */

function updateRepeatUI(){

    document
    .getElementById(
        "currentRepeat"
    )
    .textContent =
    currentRepeat;


    document
    .getElementById(
        "totalRepeat"
    )
    .textContent =
    totalRepeat;


    const percent =
        (
            currentRepeat
            /
            totalRepeat
        )
        *
        100;


    document
    .getElementById(
        "progressBar"
    )
    .style.width =
    percent + "%";

}


function setStatus(text){

    document
    .getElementById(
        "status"
    )
    .textContent =
    text;

}


/* ==================================================
   Audio Analyzer
================================================== */

function setupAudioAnalyzer(){

    if(!audio)
        return;


    try{

        if(
            !audioContext
        ){

            audioContext =
                new (
                    window.AudioContext
                    ||
                    window.webkitAudioContext
                )();

        }


        if(sourceNode){

            try{
                sourceNode.disconnect();
            }catch(e){}

        }


        sourceNode =
            audioContext
            .createMediaElementSource(
                audio
            );


        analyser =
            audioContext
            .createAnalyser();


        analyser.fftSize = 64;


        sourceNode.connect(
            analyser
        );


        analyser.connect(
            audioContext.destination
        );

    }
    catch(error){

        console.log(
            "Audio analyzer error",
            error
        );

    }

}


/* ==================================================
   聲波
================================================== */

function startWave(){

    const wave =
        document
        .getElementById(
            "wave"
        );


    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    const bars =
        wave.querySelectorAll(
            "span"
        );


    if(
        !analyser
    ){

        bars.forEach(
            bar=>{
                bar.style.height =
                    "40px";
            }
        );

        return;

    }


    const data =
        new Uint8Array(
            analyser.frequencyBinCount
        );


    function animate(){

        analyser.getByteFrequencyData(
            data
        );


        bars.forEach(
            (bar,index)=>{

                const value =
                    data[
                        index %
                        data.length
                    ];


                const height =
                    15
                    +
                    value * .8;


                bar.style.height =
                    height + "px";

            }
        );


        animationId =
            requestAnimationFrame(
                animate
            );

    }


    cancelAnimationFrame(
        animationId
    );

    animate();

}


function stopWave(){

    cancelAnimationFrame(
        animationId
    );


    const bars =
        document
        .querySelectorAll(
            ".wave span"
        );


    bars.forEach(
        bar=>{
            bar.style.height =
                "20px";
        }
    );

}


/* ==================================================
   IndexedDB 音訊快取
================================================== */

let dbPromise = null;


function openDB(){

    if(dbPromise)
        return dbPromise;


    dbPromise =
        new Promise(
            (resolve,reject)=>{

                const request =
                    indexedDB.open(
                        "AI_TTS_DB",
                        1
                    );


                request.onupgradeneeded =
                    function(event){

                        const db =
                            event.target.result;


                        if(
                            !db.objectStoreNames
                            .contains("audio")
                        ){

                            db.createObjectStore(
                                "audio"
                            );

                        }

                    };


                request.onsuccess =
                    function(){

                        resolve(
                            request.result
                        );

                    };


                request.onerror =
                    function(){

                        reject(
                            request.error
                        );

                    };

            }
        );


    return dbPromise;

}


async function saveAudioCache(
    key,
    base64
){

    try{

        const db =
            await openDB();


        return new Promise(
            (resolve,reject)=>{

                const tx =
                    db.transaction(
                        "audio",
                        "readwrite"
                    );


                tx.objectStore(
                    "audio"
                ).put(
                    base64,
                    key
                );


                tx.oncomplete =
                    resolve;

                tx.onerror =
                    ()=>reject(
                        tx.error
                    );

            }
        );

    }
    catch(error){

        console.log(
            "Cache save error",
            error
        );

    }

}


async function readAudioCache(
    key
){

    try{

        const db =
            await openDB();


        return new Promise(
            (resolve,reject)=>{

                const tx =
                    db.transaction(
                        "audio",
                        "readonly"
                    );


                const request =
                    tx.objectStore(
                        "audio"
                    ).get(
                        key
                    );


                request.onsuccess =
                    ()=>{
                        resolve(
                            request.result
                        );
                    };


                request.onerror =
                    ()=>{
                        reject(
                            request.error
                        );
                    };

            }
        );

    }
    catch(error){

        return null;

    }

}


/* ==================================================
   儲存進度
================================================== */

function saveProgress(){

    const data = {

        title:
        document
        .getElementById(
            "title"
        )
        .value,

        text:
        document
        .getElementById(
            "text"
        )
        .value,

        mode:mode,

        voice:
        selectedVoice.id,

        total:
        totalRepeat,

        current:
        currentRepeat,

        updated:
        new Date().toISOString()

    };


    localStorage.setItem(
        "ttsReadingProgress",
        JSON.stringify(data)
    );

}


/* ==================================================
   讀取進度
================================================== */

function loadProgress(){

    const raw =
        localStorage.getItem(
            "ttsReadingProgress"
        );


    if(!raw)
        return;


    try{

        const data =
            JSON.parse(raw);


        document
        .getElementById(
            "resumeBox"
        )
        .classList
        .add("show");


        document
        .getElementById(
            "resumeTitle"
        )
        .textContent =
        "🙏 發現上次未完成的誦念";


        document
        .getElementById(
            "resumeInfo"
        )
        .textContent =
        data.title
        +
        "｜第 "
        +
        data.current
        +
        " / "
        +
        data.total
        +
        " 遍";

    }
    catch(error){

        console.log(error);

    }

}


/* ==================================================
   繼續上次
================================================== */

function continueLast(){

    const raw =
        localStorage.getItem(
            "ttsReadingProgress"
        );


    if(!raw)
        return;


    const data =
        JSON.parse(raw);


    document
    .getElementById(
        "title"
    )
    .value =
    data.title;


    document
    .getElementById(
        "text"
    )
    .value =
    data.text;


    setMode(
        data.mode
    );


    const voice =
        VOICES.find(
            v =>
            v.id === data.voice
        );


    if(voice){

        selectedVoice =
            voice;

        renderVoices();

    }


    totalRepeat =
        data.total;

    currentRepeat =
        data.current;


    document
    .getElementById(
        "repeatCount"
    )
    .value =
    totalRepeat;


    document
    .getElementById(
        "resumeBox"
    )
    .classList
    .remove(
        "show"
    );


    isStopped = false;


    playCurrent();

}


/* ==================================================
   重新開始
================================================== */

function restartLast(){

    localStorage.removeItem(
        "ttsReadingProgress"
    );


    document
    .getElementById(
        "resumeBox"
    )
    .classList
    .remove(
        "show"
    );

}


/* ==================================================
   今日統計
================================================== */

function getStats(){

    const raw =
        localStorage.getItem(
            "ttsStats"
        );


    if(!raw){

        return {
            today:0,
            week:0,
            total:0
        };

    }


    try{

        return JSON.parse(raw);

    }
    catch(e){

        return {
            today:0,
            week:0,
            total:0
        };

    }

}


function addTodayCount(n){

    const stats =
        getStats();


    stats.today += n;

    stats.week += n;

    stats.total += n;


    localStorage.setItem(
        "ttsStats",
        JSON.stringify(
            stats
        )
    );


    updateStats();

}


function updateStats(){

    const stats =
        getStats();


    document
    .getElementById(
        "todayCount"
    )
    .textContent =
    stats.today.toLocaleString();


    document
    .getElementById(
        "weekCount"
    )
    .textContent =
    stats.week.toLocaleString();


    document
    .getElementById(
        "totalCount"
    )
    .textContent =
    stats.total.toLocaleString();

}


/* ==================================================
   初始化
================================================== */

renderVoices();

loadProgress();

updateStats();
